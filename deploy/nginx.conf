server {
    listen 80;
    listen [::]:80;
    server_name solarman.jilanov.com;
    access_log off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name solarman.jilanov.com;
    ssl_certificate /etc/letsencrypt/live/solarman.jilanov.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/solarman.jilanov.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Trust client addresses only from Cloudflare's published proxy networks.
    include /etc/nginx/snippets/solarman-cloudflare.conf;
    client_max_body_size 8k;
    # Query strings can contain invitation tokens; command audits live in PostgreSQL.
    access_log off;
    # Ordinary upstream errors can include secret-bearing request URLs.
    error_log /var/log/nginx/solarman-error.log crit;

    # Callback paths contain private, single-command correlation tokens.
    location ^~ /solarman/callback/ {
        access_log off;
        proxy_pass http://127.0.0.1:3230;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;
    }
    # Invitation query strings must not be retained in access logs.
    location = /activate {
        access_log off;
        proxy_pass http://127.0.0.1:3230;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / {
        proxy_pass http://127.0.0.1:3230;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;
    }
}
